name: Godot web demo (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'godot/**'
      - 'development/godot/**'
      - '.github/workflows/godot-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 + web export templates
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export web build
        run: ./godot/export_web.sh

      - name: Web export smoke
        run: |
          chmod +x development/godot/web_export_smoke.sh
          ./development/godot/web_export_smoke.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
